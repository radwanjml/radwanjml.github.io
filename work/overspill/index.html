const tryHtml = D.try.kind === 'rig'
  ? `<div class="tryit glass" id="tryit"><span class="label stage-label">Live · <span id="rig-name">Pip</span></span><div id="rig"></div><div class="dock glass" role="group" aria-label="Character" style="position:absolute;left:50%;bottom:18px;translate:-50% 0;z-index:2"><button type="button" data-char="pip" aria-pressed="true">Pip</button><button type="button" data-char="moobi" aria-pressed="false">Moobi</button><button type="button" data-char="eli3" aria-pressed="false">Eli3</button></div><a class="btn open-live" href="${D.try.url}" target="_blank" rel="noopener">${D.try.cta} ↗</a></div><p class="rig-spec" id="rig-spec" aria-live="polite"></p>`
  : `<div class="tryit glass" id="tryit" style="--poster:url('${D.poster}')"><div class="gate"><b>${D.try.cta}</b><small>${D.try.note}</small>${D.try.kind === 'frame' ? `<button class="btn btn-solid" type="button" id="load">Load the game</button>` : `<a class="btn btn-solid" href="${D.try.url}" target="_blank" rel="noopener">Open ↗</a>`}</div></div>`;
legs.innerHTML = `
  <section class="leg rv" data-wp="0"><span class="label">Waypoint 01 · ${WP[0][1]}</span><h2>${D.brief[0]}</h2><p>${D.brief[1]}</p><p>${D.brief[2]}</p></section>
  <section class="leg rv" data-wp="1"><span class="label">Waypoint 02 · ${WP[1][1]}</span><h2>What I <em>built</em></h2>
    <div class="stats">${D.stats.map(([b, t]) => `<div class="stat glass"><b>${b}</b><span>${t}</span></div>`).join('')}</div></section>
  <section class="leg rv" data-wp="2"><span class="label">Waypoint 03 · ${WP[2][1]}</span><h2>The <em>hard</em> parts</h2>
    <div class="cards">${D.hard.map(([h, p, d, r]) => `<article class="card glass"><h3>${h}</h3><dl><dt>Problem</dt><dd>${p}</dd><dt>Decision</dt><dd>${d}</dd><dt>Result</dt><dd><strong>${r}</strong></dd></dl></article>`).join('')}</div></section>
  <section class="leg rv" data-wp="3"><span class="label">Waypoint 04 · ${WP[3][1]}</span><h2>Try <em>it</em></h2>${tryHtml}${D.builds ? `<div class="builds"><p class="label">All five builds, live</p>${D.builds.map(([u, t, n]) => `<a href="https://${u}" target="_blank" rel="noopener"><b>${t}</b><span>${n}</span></a>`).join('')}</div>` : ''}</section>
  <section class="leg rv" data-wp="4"><span class="label">Waypoint 05 · ${WP[4][1]}</span><h2>What’s <em>next</em></h2><p>${D.nextNote}</p></section>`;

const N = CS[D.next];
const nx = document.getElementById('next');
nx.href = `work/${D.next}/`;
nx.innerHTML = `<img src="${N.poster}" alt="" loading="lazy"><div><span class="label">Next expedition · ${N.eyebrow.split('·')[0].replace('Case study ', '')}</span><b>${N.title}</b><i>→</i></div>`;

// ---------- try it ----------
document.getElementById('load')?.addEventListener('click', () => {
  const t = document.getElementById('tryit'); t.innerHTML = `<iframe src="${D.try.url}" title="Overspill, playable" allow="fullscreen" loading="lazy"></iframe>`;
});
if (D.try.kind === 'rig') {
  const slot = document.getElementById('rig');
  // moved from the home page (Addendum 48): the models ship as rigid parts, every motion is code
  const SPEC = {
    pip: 'Hover ring, body tilt, two antennae and two hands on springs · Blender, 0.4 MB GLB',
    moobi: 'Wheel roll from distance travelled, bell, ears and arms on springs · Blender, 0.3 MB GLB',
    eli3: 'Rolling ball, ears and hooves on springs, and a 12-ring trunk that unrolls to wave · Blender, 0.8 MB GLB',
  };
  const spec = document.getElementById('rig-spec');
  const showSpec = (n) => { spec.innerHTML = `<b>Rig</b> ${SPEC[n]}. No bones: driven by body-space velocity, acceleration and yaw rate.`; };
  showSpec('pip');
  document.querySelectorAll('#tryit [data-char]').forEach((b) => b.addEventListener('click', () => showSpec(b.dataset.char)));
  new IntersectionObserver(async ([e], io) => {
    if (!e.isIntersecting) return; io.disconnect();
    try {
      const { createCharStage } = await import('./drafts/chars.js');
      const stage = await createCharStage(slot, { mode: document.documentElement.dataset.mode });
      await stage.set('pip');
      const btns = [...document.querySelectorAll('#tryit [data-char]')];
      btns.forEach((b) => b.addEventListener('click', async () => { btns.forEach((x) => x.setAttribute('aria-pressed', String(x === b))); document.getElementById('rig-name').textContent = b.textContent; await stage.set(b.dataset.char); }));
      (window.requestIdleCallback || ((f) => setTimeout(f, 1200)))(() => stage.warm(['moobi', 'eli3']).catch(() => {}));
    } catch (err) { slot.innerHTML = `<p style="padding:30px">The live rig needs WebGL. <a href="${D.try.url}">Open the cove ↗</a></p>`; }
  }, { rootMargin: '200px' }).observe(slot);
}

// ---------- the route ----------
const svg = document.getElementById('route'), NS = 'http://www.w3.org/2000/svg';
// built at the rail's real pixel size (a stretched viewBox widened the labels)
const H = Math.max(400, svg.clientHeight || innerHeight - 160); svg.setAttribute('viewBox', `0 0 170 ${H}`);
const ys = [0.06, 0.27, 0.48, 0.69, 0.9].map((f) => f * H);
let d = `M 40 ${ys[0]}`;
ys.slice(1).forEach((y, j) => { const k = j + 1, x = k % 2 ? 110 : 40, gap = ys[k] - ys[k - 1]; d += ` C ${k % 2 ? 40 : 110} ${y - gap * 0.55}, ${x} ${y - gap * 0.4}, ${x} ${y}`; });
const mk = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
mk('path', { d, class: 'track', 'vector-effect': 'non-scaling-stroke' });
const drawn = mk('path', { d, class: 'drawn', 'vector-effect': 'non-scaling-stroke' });
const L = drawn.getTotalLength(); drawn.style.strokeDasharray = L; drawn.style.strokeDashoffset = L;
const wps = ys.map((y, k) => {
  const g = mk('g', { class: 'wp' }); const x = k % 2 ? 110 : 40;
  const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 5); c.setAttribute('vector-effect', 'non-scaling-stroke'); g.appendChild(c);
  const t = document.createElementNS(NS, 'text'); t.setAttribute('x', k % 2 ? 0 : 54); t.setAttribute('y', y - 14); t.textContent = WP[k][0]; g.appendChild(t);
  const a = document.createElementNS(NS, 'text'); a.setAttribute('x', k % 2 ? 0 : 54); a.setAttribute('y', y + 4); a.setAttribute('class', 'alt'); a.textContent = WP[k][1]; g.appendChild(a);
  return g;
});
const sections = [...document.querySelectorAll('.leg')];
function onScroll() {
  const vh = innerHeight; let p = 0, on = -1;
  sections.forEach((s, k) => { const r = s.getBoundingClientRect(); if (r.top < vh * 0.55) on = k; });
  const first = sections[0].getBoundingClientRect().top + scrollY, last = sections.at(-1).getBoundingClientRect().bottom + scrollY;
  p = Math.min(1, Math.max(0, (scrollY + vh * 0.55 - first) / (last - first)));
  drawn.style.strokeDashoffset = (L * (1 - p)).toFixed(1);
  wps.forEach((g, k) => g.classList.toggle('on', k <= on));
}
let sq = 0; addEventListener('scroll', () => { if (!sq) sq = requestAnimationFrame(() => { sq = 0; onScroll(); }); }, { passive: true }); onScroll();   // one layout read per frame (Addendum 46)

// reveals + phone menu
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.rv').forEach((el) => io.observe(el));
const mb = document.querySelector('.menu-btn'), menu = document.getElementById('menu');
mb?.addEventListener('click', () => { const o = menu.hidden; mb.setAttribute('aria-expanded', String(o)); menu.hidden = !o; });
</script>
</body>
</html>
