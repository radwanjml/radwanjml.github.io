<style>
/* model page (Addendum 49): one template, data in drafts/models-data.js */
body { background: var(--bg); }
.topo-bg { position: fixed; inset: 0; z-index: -1; opacity: .22; pointer-events: none; } .topo-bg canvas { width: 100%; height: 100%; display: block; }
.mp { width: min(1200px, 100% - 2 * var(--pad)); margin: 0 auto; padding: 120px 0 80px; }
.back { display: inline-flex; align-items: center; min-height: 44px; font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); text-decoration: none; }
.back:hover { color: var(--accent-text); }
.mp h1 { font: 400 clamp(40px, 7vw, 88px)/1 var(--serif); margin: 14px 0 10px; }
.mp .note { font: 500 12px/1.6 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin: 0 0 28px; }
.media { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: clamp(14px, 2vw, 24px); align-items: start; }
.media figure { margin: 0; border-radius: var(--r); overflow: hidden; padding: 10px; }
.media img, .media video { display: block; width: 100%; height: auto; max-height: 82svh; object-fit: contain; border-radius: calc(var(--r) - 8px); background: rgba(0,0,0,.2); }
.media figcaption { font: 500 11px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding: 10px 6px 2px; }
.acts { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0 0; }
.info { margin-top: 36px; max-width: 70ch; font-size: 17px; line-height: 1.65; white-space: pre-line; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: clamp(12px, 1.6vw, 18px); margin-top: clamp(14px, 2vw, 24px); }
.gal figure { margin: 0; border-radius: var(--r); overflow: hidden; padding: 8px; }
.gal img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: calc(var(--r) - 8px); background: rgba(0,0,0,.2); }
.gal figcaption { font: 500 11px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding: 8px 4px 0; }
.pn { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; border-top: 1px solid var(--line); padding-top: 18px; }
.pn a { display: grid; gap: 4px; min-height: 44px; text-decoration: none; color: var(--text); } .pn a:last-child { text-align: right; }
.pn small { font: 500 11px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); } .pn b { font: 400 22px/1.2 var(--serif); }
.pn a:hover b { color: var(--accent-text); }
</style>

<body>
<div class="topo-bg" aria-hidden="true"><canvas id="topo"></canvas></div>

<main class="mp">
  <a class="back" href="models/">← All models</a>
  <h1 id="t"></h1>
  <p class="note" id="note"></p>
  <div class="media" id="media"></div>
  <div class="acts" id="acts"></div>
  <div class="info" id="info" hidden></div>
  <nav class="pn" aria-label="More models"><a id="prev"></a><a id="next"></a></nav>
</main>
<script type="module">
import { R, EXTRA, DIMS } from './drafts/models-data.js';
import { initTopo } from './drafts/topo.js';
const q = new URLSearchParams(location.search).get('m');
let i = R.findIndex((r) => r[0] === q); if (i < 0) i = 0;
const [slug, title, note] = R[i], X = EXTRA[slug], [sw, sh, vw, vh] = DIMS[slug] || [];
document.title = `${title} · Radwan Jameel`;
document.getElementById('t').textContent = title;
document.getElementById('note').textContent = note || 'Modelled and rendered in Blender';
const media = document.getElementById('media');
media.innerHTML = `<figure class="glass"><img src="assets/img/models/${slug}.webp" alt="${title}, still render" decoding="async" width="${sw || 1600}" height="${sh || 1600}"><figcaption>Still</figcaption></figure>`
  + (X.video ? `<figure class="glass"><video muted loop playsinline preload="none" width="${vw || 1280}" height="${vh || 720}" poster="assets/video/models/${slug}.webp" aria-label="${title}, animated render"><source src="assets/video/models/${slug}.mp4" type="video/mp4"></video><figcaption>Animation</figcaption></figure>` : '');
if (X.gallery) media.insertAdjacentHTML('afterend', `<div class="gal">${X.gallery.map(([f, c]) => `<figure class="glass"><img src="assets/img/herrand/${f}.webp" alt="${title}: ${c}" loading="lazy" decoding="async" width="1920" height="1080"><figcaption>${c}</figcaption></figure>`).join('')}</div>`);
const v = media.querySelector('video');
if (v) {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) v.controls = true;
  else new IntersectionObserver(([e]) => { if (e.isIntersecting) { v.preload = 'auto'; v.play().catch(() => {}); } else v.pause(); }, { threshold: .35 }).observe(v);
}
const acts = document.getElementById('acts');
if (X.glb) acts.innerHTML = `<a class="btn btn-solid" href="viewer/?m=${X.glb}">Turn it in 3D</a>`;
if (X.link) acts.insertAdjacentHTML('beforeend', `<a class="btn" href="${X.link[0]}">${X.link[1]}</a>`);
if (X.info) { const el = document.getElementById('info'); el.textContent = X.info; el.hidden = false; }
const link = (el, k, lab) => { const r = R[(k + R.length) % R.length]; el.href = `model/?m=${r[0]}`; el.innerHTML = `<small>${lab}</small><b>${r[1]}</b>`; };
link(document.getElementById('prev'), i - 1, '← Previous'); link(document.getElementById('next'), i + 1, 'Next →');
const mode = document.documentElement.dataset.mode;
initTopo(document.getElementById('topo'), { mode, reducedMotion: true, scale: 340, seed: 23, variety: 1 });
const mb = document.querySelector('.menu-btn'), menu = document.getElementById('menu');
mb?.addEventListener('click', () => { const o = mb.getAttribute('aria-expanded') !== 'true'; mb.setAttribute('aria-expanded', String(o)); menu.hidden = !o; });
</script>
</body>
