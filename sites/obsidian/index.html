<style>
  @property --r {
    syntax: '<length>';
    inherits: false;
    initial-value: 0px;
  }

  :root {
    --ink:   #070708;
    --bone:  #f4efe6;
    --ash:   #a39c92;
    --ash-2: #6f6a63;
    --blood: #cf3a2e;
    --char:  #121116;
    --spot:  240px;
    --shift: 0px;   /* horizontal nudge for the creepy layer */
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    background: var(--ink);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .font-display { font-family:'Playfair Display', serif; }
  .font-mono { font-family:'Space Mono', monospace; }

  /* ---------- NAV ---------- */
  nav {
    position: fixed; inset: 0 0 auto 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px clamp(18px, 4vw, 56px);
    pointer-events: none;
  }
  nav > * { pointer-events: auto; }

  .brand { display:flex; align-items:baseline; gap:10px; }
  .brand .mark {
    font-family:'Playfair Display', serif; font-style:italic; font-weight:600;
    font-size: 26px; color: var(--bone); line-height:1;
  }
  .brand .sub {
    font-family:'Space Mono', monospace; font-size:10px; letter-spacing:.32em;
    color: var(--ash-2); text-transform:uppercase; transform: translateY(-1px);
  }

  .pill {
    display:none;
    position:absolute; left:50%; transform:translateX(-50%);
    background: rgba(9,9,11,.62);
    border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(18px) saturate(120%); -webkit-backdrop-filter: blur(18px) saturate(120%);
    border-radius: 999px; padding: 6px;
    align-items:center; gap:2px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .pill a {
    color: rgba(244,239,230,.82); text-decoration:none; font-size:13px; font-weight:500;
    padding: 8px 16px; border-radius:999px; transition: color .2s, background .2s;
  }
  .pill a:hover { color: var(--bone); background: rgba(255,255,255,.10); }
  .pill a.active { color: var(--ink); background: var(--bone); }

  .book {
    font-size:13px; font-weight:600; color: var(--ink); background: var(--bone);
    border:none; border-radius:999px; padding: 11px 22px; cursor:pointer;
    transition: transform .2s, box-shadow .2s, background .2s;
  }
  .book:hover { background:#fff; transform: translateY(-1px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .book:active { transform: translateY(0) scale(.98); }

  /* ---------- STAGE / REVEAL ---------- */
  .stage {
    position: relative; width:100%; height:100vh; height:100dvh;
    overflow:hidden; background: var(--ink);
    cursor: crosshair;
  }
  .layer {
    position:absolute; inset:0;
    background-position: right center; background-size: cover; background-repeat:no-repeat;
  }

    background-position: calc(100% + var(--shift)) center;
    --x: 50%; --y: 42%; --r: 0px;
    -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        #000 0%, #000 38%, rgba(0,0,0,.78) 58%, rgba(0,0,0,.42) 74%, rgba(0,0,0,.12) 88%, transparent 100%);
            mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        #000 0%, #000 38%, rgba(0,0,0,.78) 58%, rgba(0,0,0,.42) 74%, rgba(0,0,0,.12) 88%, transparent 100%);
    transition: --r .4s cubic-bezier(.22,1,.36,1);
    will-change: --r;
  }
  .stage.is-active .reveal { --r: var(--spot); }

  /* thin red seam where the spotlight bites — ties it to the rim-light in the art */
  .ring {
    position:absolute; z-index:31; pointer-events:none;
    width: calc(var(--spot) * 2); height: calc(var(--spot) * 2);
    left: var(--rx, 50%); top: var(--ry, 42%);
    transform: translate(-50%,-50%) scale(var(--ring-s, 0));
    border-radius:50%;
    box-shadow: 0 0 0 1px rgba(207,58,46,.35), 0 0 40px 0 rgba(207,58,46,.12) inset;
    transition: transform .4s cubic-bezier(.22,1,.36,1);
    mix-blend-mode: screen;
  }
  .stage.is-active .ring { --ring-s: 1; }

  /* legibility scrim over the left negative space */
  .scrim {
    position:absolute; inset:0; z-index:40; pointer-events:none;
    background: linear-gradient(100deg, var(--ink) 0%, rgba(7,7,8,.92) 26%, rgba(7,7,8,.45) 48%, transparent 66%);
  }

  /* dark band under the nav so links stay legible over the bright face */
  .topfade {
    position:absolute; inset:0 0 auto 0; height:150px; z-index:44; pointer-events:none;
    background: linear-gradient(to bottom, rgba(7,7,8,.72) 0%, rgba(7,7,8,.34) 46%, transparent 100%);
  }

  /* ---------- CONTENT (left, in the black) ---------- */
  .content {
    position:absolute; z-index:50; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:center;
    padding: 0 clamp(20px, 5vw, 64px);
    max-width: 640px;
  }
  .content > * { pointer-events:auto; }

  .eyebrow {
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:.34em;
    text-transform:uppercase; color: var(--blood); margin-bottom: 22px;
    display:flex; align-items:center; gap:12px;
  }
  .eyebrow::before { content:""; width:34px; height:1px; background: var(--blood); opacity:.7; }

  h1 { line-height:.92; margin-bottom: 26px; }
  h1 .l1 {
    display:block; font-family:'Playfair Display', serif; font-style:italic; font-weight:400;
    font-size: clamp(2.9rem, 8vw, 6.2rem); letter-spacing:-.03em; color: var(--bone);
  }
  h1 .l2 {
    display:block; font-weight:600; font-size: clamp(2.9rem, 8vw, 6.2rem);
    letter-spacing:-.05em; color: var(--bone); margin-top:-.08em;
  }
  h1 .l2 em { font-style:normal; color: var(--blood); }

  .lede {
    font-size: clamp(.98rem, 1.5vw, 1.12rem); line-height:1.6; color: var(--ash);
    max-width: 30ch; margin-bottom: 34px; font-weight:300;
  }

  .cta-row { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom: 40px; }
  .cta {
    font-size:14px; font-weight:600; color:var(--ink); background:var(--bone);
    border:none; border-radius:999px; padding: 15px 28px; cursor:pointer;
    transition: transform .2s, box-shadow .2s, background .2s;
  }
  .cta:hover { background:#fff; transform: translateY(-2px); box-shadow: 0 16px 40px rgba(0,0,0,.55); }
  .cta:active { transform: translateY(0) scale(.98); }
  .ghost {
    background:none; border:none; color:var(--bone); font-size:14px; font-weight:500;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; padding:6px 2px;
    border-bottom:1px solid transparent; transition: gap .2s, border-color .2s, color .2s;
  }
  .ghost:hover { gap:13px; border-color: rgba(244,239,230,.4); }
  .ghost .arr { color: var(--blood); transition: transform .2s; }
  .ghost:hover .arr { transform: translateX(3px); }

  .hint {
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:.12em;
    color: var(--ash-2); display:flex; align-items:center; gap:10px;
    transition: opacity .5s; text-transform:uppercase;
  }
  .hint .dot {
    width:6px; height:6px; border-radius:50%; background: var(--blood);
    box-shadow: 0 0 0 0 rgba(207,58,46,.6); animation: pulse 2.4s infinite;
  }
  .stage.touched .hint { opacity:.35; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(207,58,46,.55); }
    70% { box-shadow: 0 0 0 9px rgba(207,58,46,0); }
    100% { box-shadow: 0 0 0 0 rgba(207,58,46,0); }
  }

  /* corner detail */
  .corner {
    position:absolute; z-index:50; bottom: 26px; right: clamp(20px,5vw,56px);
    font-family:'Space Mono', monospace; font-size:10px; letter-spacing:.28em;
    text-transform:uppercase; color: var(--ash-2); text-align:right; pointer-events:none;
  }

  /* ---------- LOAD ANIMATION ---------- */
  @keyframes rise { 0%{opacity:0; transform:translateY(26px); filter:blur(10px);} 100%{opacity:1; transform:translateY(0); filter:blur(0);} }
  @keyframes fade { 0%{opacity:0; transform:translateY(16px);} 100%{opacity:1; transform:translateY(0);} }
  @keyframes kb   { 0%{transform:scale(1.12);} 100%{transform:scale(1);} }
  .anim { opacity:0; animation-fill-mode:forwards; animation-timing-function:cubic-bezier(.16,1,.3,1); }
  .a-rise { animation-name:rise; animation-duration:1.1s; }
  .a-fade { animation-name:fade; animation-duration:1s; }
  .layer.base, .layer.reveal { animation: kb 2.4s cubic-bezier(.16,1,.3,1) forwards; }

  /* ---------- RESPONSIVE ---------- */
  @media (min-width: 880px) { .pill { display:flex; } }
  @media (max-width: 620px) {
    .scrim { background: linear-gradient(100deg, var(--ink) 0%, rgba(7,7,8,.9) 40%, rgba(7,7,8,.55) 72%, rgba(7,7,8,.25) 100%); }
    .layer { background-position: center 18%; }
    .layer.reveal { background-position: calc(50% + var(--shift)) 18%; }
    .content { justify-content:flex-end; padding-bottom: 16vh; }
    .corner { display:none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .anim { animation:none !important; opacity:1 !important; }
    .layer.base, .layer.reveal { animation:none !important; }
    .reveal { transition:none; }
    .ring { transition:none; }
    .hint .dot { animation:none; }
  }

  :focus-visible { outline: 2px solid var(--blood); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>

<nav>
  <div class="brand">
    <span class="mark">Obsidian</span>
    <span class="sub">Dental Atelier</span>
  </div>
  <div class="pill">
    <a href="#" class="active">Treatments</a>
    <a href="#">The Atelier</a>
    <a href="#">Results</a>
    <a href="#">Visit</a>
  </div>
  <button class="book">Book now</button>
</nav>

<main class="stage" id="stage" aria-label="Portrait that reveals a before-and-after smile. Move your cursor across the face to reveal the before.">
  <div class="layer base"></div>
  <div class="layer reveal" id="reveal"></div>
  <div class="ring" id="ring"></div>
  <div class="scrim"></div>
  <div class="topfade"></div>

  <div class="content">
    <div class="eyebrow anim a-fade" style="animation-delay:.15s">Cosmetic &amp; Restorative Dentistry</div>
    <h1>
      <span class="l1 anim a-rise" style="animation-delay:.28s">Every smile</span>
      <span class="l2 anim a-rise" style="animation-delay:.42s">hides a <em>before</em>.</span>
    </h1>
    <p class="lede anim a-fade" style="animation-delay:.62s">
      We rebuild the smiles that time, fear, and neglect left behind — quietly, and without judgement.
    </p>
    <div class="cta-row anim a-fade" style="animation-delay:.74s">
      <button class="cta">Book a consultation</button>
      <button class="ghost">See real results <span class="arr">&rarr;</span></button>
    </div>
    <div class="hint anim a-fade" id="hint" style="animation-delay:.9s">
      <span class="dot"></span><span id="hintText">Drag across the face to reveal the before</span>
    </div>
  </div>

  <div class="corner">By appointment<br>Riyadh &middot; Dubai</div>
</main>

<script>
  const stage  = document.getElementById('stage');
  const reveal = document.getElementById('reveal');
  const ring   = document.getElementById('ring');
  const hint   = document.getElementById('hint');
  const hintText = document.getElementById('hintText');

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  if (coarse) hintText.textContent = 'Touch and drag across the face';

  let tx = 0.66, ty = 0.42;   // target  (fractions of stage)
  let cx = 0.66, cy = 0.42;   // current (eased)
  let active = false;
  let touched = false;

  function setPoint(clientX, clientY) {
    const r = stage.getBoundingClientRect();
    tx = (clientX - r.left) / r.width;
    ty = (clientY - r.top)  / r.height;
    if (!touched) { touched = true; stage.classList.add('touched'); }
  }

  function enable()  { active = true;  stage.classList.add('is-active'); }
  function disable() { active = false; stage.classList.remove('is-active'); }

  // Pointer events cover mouse, pen and touch
  stage.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { setPoint(e.clientX, e.clientY); enable(); } });
  stage.addEventListener('pointermove',  e => {
    setPoint(e.clientX, e.clientY);
    if (e.pointerType === 'mouse') enable();
  });
  stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') disable(); });
  stage.addEventListener('pointerdown',  e => { setPoint(e.clientX, e.clientY); enable(); });
  stage.addEventListener('pointerup',    e => { if (e.pointerType !== 'mouse') disable(); });
  stage.addEventListener('pointercancel',() => disable());

  // Smooth follow (lerp) + write CSS vars each frame
  const ease = reduce ? 1 : 0.16;
  function loop() {
    cx += (tx - cx) * ease;
    cy += (ty - cy) * ease;
    const xp = (cx * 100).toFixed(2) + '%';
    const yp = (cy * 100).toFixed(2) + '%';
    reveal.style.setProperty('--x', xp);
    reveal.style.setProperty('--y', yp);
    ring.style.setProperty('--rx', xp);
    ring.style.setProperty('--ry', yp);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
