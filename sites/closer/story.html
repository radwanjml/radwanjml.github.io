  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#120d16;
    font-family:'Fredoka',system-ui,sans-serif;color:var(--cream);
    user-select:none;-webkit-user-select:none}

  #deck{position:fixed;inset:0;cursor:pointer}
  .beat{position:absolute;inset:0;opacity:0;pointer-events:none;
    transition:opacity 1.15s var(--gutter);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(28px + var(--safe-t)) 22px calc(28px + var(--safe-b));gap:clamp(18px,4vh,40px)}
  .beat.on{opacity:1}

  /* per-beat wash, sampled FROM each render's own edge + shadow so the
     feathered image dissolves into a ground made of its own light */
  .wash{position:absolute;inset:0;z-index:0}
  #b0 .wash{background:radial-gradient(120% 85% at 50% 42%, #2a1b30 0%, #1a1420 55%, #120d16 100%)}
  #b1 .wash{background:radial-gradient(115% 80% at 52% 45%, #4a2f1b 0%, #2a1a10 52%, #110a07 100%)}
  #b2 .wash{background:radial-gradient(125% 85% at 42% 48%, #91694a 0%, #5c4230 50%, #3d2e1c 100%)}
  #b3 .wash{background:radial-gradient(120% 82% at 48% 45%, #6d463a 0%, #452b1e 52%, #26180c 100%)}
  #b4 .wash{background:radial-gradient(125% 88% at 50% 46%, #7c493d 0%, #52301f 52%, #371d15 100%)}

  .art{position:relative;z-index:1;max-width:min(96vw,1100px);max-height:56vh;
    width:auto;height:auto;object-fit:contain;
    filter:drop-shadow(0 24px 60px rgba(0,0,0,.45))}

  .line{position:relative;z-index:1;text-align:center;
    font-family:'Space Mono',monospace;line-height:2.0;max-width:44ch;
    font-size:clamp(11px,1.9vh,14.5px);color:rgba(232,222,236,.6)}
  .line.em{color:var(--cream);opacity:.92}
  .line .quiet{display:block;margin-top:.5em;
    color:rgba(185,167,191,.4);font-style:italic}

  /* title */
  #logoWrap{position:relative;z-index:1;width:clamp(96px,20vh,150px);opacity:.92}
  #logoWrap svg{width:100%;height:auto;display:block}
  #wordmark{position:relative;z-index:1;text-align:center}
  #wordmark .n{font-size:clamp(26px,5.5vh,42px);letter-spacing:.01em}
  #wordmark .s{font-family:'Space Mono',monospace;font-size:9px;text-transform:uppercase;
    letter-spacing:.28em;color:var(--muted);opacity:.7;margin-top:8px}

  /* grain: tiled at 1:1, NEVER scaled. scaled grain is mush, and mush is the
     one thing that reads as cheap. sits above everything except the chrome. */
  #grain{position:fixed;inset:0;z-index:5;pointer-events:none;
    background-repeat:repeat;background-size:160px 160px;opacity:.5;
    mix-blend-mode:soft-light}
  #vig{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(130% 95% at 50% 50%, transparent 42%, rgba(10,6,12,.55) 100%)}

  #skip{position:fixed;z-index:12;right:calc(16px + var(--safe-r));bottom:calc(16px + var(--safe-b));
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);opacity:0;transition:opacity .6s ease;cursor:pointer;
    padding:9px 13px;border-radius:999px;border:1px solid rgba(245,236,221,.12);
    background:rgba(20,14,24,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #skip.show{opacity:.75}
  #skip:hover{opacity:1}

  #dots{position:fixed;z-index:12;left:0;right:0;bottom:calc(18px + var(--safe-b));
    display:flex;justify-content:center;gap:6px;pointer-events:none;
    opacity:0;transition:opacity .6s ease}
  #dots.show{opacity:1}
  .dot{width:5px;height:5px;border-radius:50%;background:rgba(245,236,221,.2);transition:all .5s ease}
  .dot.on{background:var(--warm);width:16px;border-radius:3px}

  #tapHint{position:fixed;z-index:12;left:0;right:0;bottom:calc(44px + var(--safe-b));
    text-align:center;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .8s ease;
    pointer-events:none}
  #tapHint.show{opacity:.4}

  @media(prefers-reduced-motion:reduce){.beat{transition-duration:.2s}}
</style>
</head>

<div id="deck">

  <section class="beat on" id="b0">
    <div class="wash"></div>
    <div id="logoWrap">

    </div>
    <div id="wordmark"><div class="n">Closer</div><div class="s">أقرب</div></div>
  </section>

  <section class="beat" id="b1">
    <div class="wash"></div>
    <img class="art" id="art1" alt="">
    <p class="line">They said they would be back by dark.</p>
  </section>

  <section class="beat" id="b2">
    <div class="wash"></div>
    <img class="art" id="art2" alt="">
    <p class="line">That was a long time ago.</p>
  </section>

  <section class="beat" id="b3">
    <div class="wash"></div>
    <img class="art" id="art3" alt="">
    <p class="line">She still switches the lights on. So do the others.
      <span class="quiet">&mdash; not yet &mdash;</span></p>
  </section>

  <section class="beat" id="b4">
    <div class="wash"></div>
    <img class="art" id="art4" alt="">
    <p class="line em">Nobody said they could wait together.</p>

    </div>
  </section>

</div>

<script>
/* ---- assets baked at build time. no live SVG filters: a full-viewport
   feTurbulence is a paint-cost trap on phones, and this page's whole job
   is to appear instantly while the server wakes up. ---- */
document.getElementById('grain').style.backgroundImage = `url(${GRAIN})`;
document.getElementById('art1').src = IMG.b1;
document.getElementById('art2').src = IMG.b2;
document.getElementById('art3').src = IMG.b3;
document.getElementById('art4').src = IMG.b4;

/* ---- room + server ride through silently, same rule as every other screen ---- */
const qs = new URLSearchParams(location.search);
const SERVER = qs.get('server') || 'wss://closer-server-c3f0.onrender.com';

/* ---- THE POINT OF THIS SCREEN.
   Render's free tier sleeps and takes ~40s to wake. The story runs about
   that long. warmServer() is ported verbatim from index-7.html. It fires on
   first paint, so by the time she reaches the doorway the shore is awake and
   she never sees a loading screen, because the loading screen was the story. */
(async function warmServer(url){
  const httpUrl = url.replace(/^ws/, 'http');
  const ctrl = new AbortController();
  const bail = setTimeout(() => ctrl.abort(), 45000);
  try { await fetch(httpUrl, { signal: ctrl.signal, mode: 'no-cors' }); } catch {}
  clearTimeout(bail);
})(SERVER);

/* ---- beats ---- */
const beats = [...document.querySelectorAll('.beat')];
let i = 0, locked = false;

const dots = document.getElementById('dots');
dots.innerHTML = beats.map((_, n) => `<div class="dot${n===0?' on':''}"></div>`).join('');

function paint(){
  beats.forEach((b, n) => b.classList.toggle('on', n === i));
  [...dots.children].forEach((d, n) => d.classList.toggle('on', n === i));
  if(i === beats.length - 1){
    document.getElementById('endLogo').style.opacity = '.95';
    document.getElementById('tapHint').textContent = 'tap to begin';
  }
}
function go(){
  if(locked) return;
  if(i >= beats.length - 1){ finish(); return; }
  locked = true;
  i++;
  paint();
  /* lock for the crossfade so a fast tapper can't stack transitions and
     skip a beat's image entirely */
  setTimeout(() => { locked = false; }, 620);
}
function finish(){
  try { localStorage.setItem('closer.seenStory', '1'); } catch {}
  const fwd = new URLSearchParams();
  if(qs.get('room')) fwd.set('room', qs.get('room'));
  if(qs.get('server')) fwd.set('server', qs.get('server'));
  const q = fwd.toString();
  location.href = 'doorway.html' + (q ? '?' + q : '');
}

document.getElementById('deck').addEventListener('click', go);
document.getElementById('skip').addEventListener('click', e => { e.stopPropagation(); finish(); });
addEventListener('keydown', e => {
  if(e.key === 'Escape') finish();
  if(e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight'){ e.preventDefault(); go(); }
});
/* swipe left also advances; never backwards. the story only runs one way. */
let sx = 0;
document.getElementById('deck').addEventListener('pointerdown', e => sx = e.clientX);
document.getElementById('deck').addEventListener('pointerup', e => {
  if(sx - e.clientX > 55) go();
});

/* skip appears after a beat, never instantly: it shouldn't be the first
   thing she sees. but it is always there after that. */
setTimeout(() => {
  document.getElementById('skip').classList.add('show');
  document.getElementById('dots').classList.add('show');
  document.getElementById('tapHint').classList.add('show');
}, 2000);
</script>
