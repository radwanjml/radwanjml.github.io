  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;
    font-family:'Fredoka',system-ui,sans-serif;color:var(--cream)}
  /* the golden preset as a flat gradient — no WebGL needed for a page
     whose whole job is to be light and fast */
  body{background:
    radial-gradient(120% 90% at 50% -10%, #a9789a 0%, #7a5a86 42%, #4a3350 78%, #2a1b30 100%);
    display:flex;align-items:center;justify-content:center;padding:24px}

  #wrap{width:100%;max-width:380px}
  #brand{text-align:center;margin-bottom:22px}
  #brand .n{font-size:26px}
  #brand .s{font-family:'Space Mono',monospace;font-size:9px;text-transform:uppercase;
    letter-spacing:.24em;color:var(--muted);opacity:.75;margin-top:5px}

  #card{padding:22px;border-radius:20px;
    background:var(--glass);border:1px solid var(--brd);
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    opacity:0;transform:translateY(10px);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
  #card.show{opacity:1;transform:none}

  .lbl{font-family:'Space Mono',monospace;font-size:8.5px;text-transform:uppercase;
    letter-spacing:.22em;color:var(--muted);opacity:.72;margin-bottom:8px;display:block}

  #nameInput{width:100%;background:rgba(245,236,221,.07);border:1px solid rgba(245,236,221,.12);
    border-radius:12px;color:var(--cream);font-family:'Fredoka',system-ui,sans-serif;
    font-size:20px;padding:13px 15px;outline:none;transition:border-color .18s}
  #nameInput:focus{border-color:var(--warm)}
  #nameInput::placeholder{color:var(--muted);opacity:.5}

  #connRow{display:flex;align-items:center;gap:9px;margin:18px 0 4px;
    font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}
  /* .podDot — identical component to index-7.html's #pod status dot */
  .podDot{width:11px;height:11px;border-radius:50%;background-color:var(--net-off);
    transition:box-shadow .4s ease;flex-shrink:0}
  .podDot.wait{background-color:var(--net-wait);animation:podPulse 1.5s ease-in-out infinite}
  .podDot.solo{background-color:var(--net-solo);box-shadow:0 0 8px rgba(127,215,164,.55)}
  @keyframes podPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(244,163,91,.5);opacity:.6}
    50%{box-shadow:0 0 9px 2px rgba(244,163,91,.65);opacity:1}
  }

  /* room: collapsed by default. Someone arriving on an invite link never sees
     it (the room is already in the link); it is only for the person who
     opened the bare site and was told a room name out loud. */
  #roomBox{margin-top:16px}
  #roomBox summary{list-style:none;cursor:pointer;font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.08em;color:var(--muted);opacity:.8;user-select:none}
  #roomBox summary::-webkit-details-marker{display:none}
  #roomBox summary::before{content:'+ ';color:var(--warm)}
  #roomBox[open] summary::before{content:'\2212  '}
  #roomInput{margin-top:10px;width:100%;background:rgba(245,236,221,.07);border:1px solid rgba(245,236,221,.12);
    border-radius:12px;color:var(--cream);font-family:'Space Mono',monospace;font-size:15px;padding:11px 14px;
    outline:none;transition:border-color .18s}
  #roomInput:focus{border-color:var(--warm)}
  #roomInput::placeholder{color:var(--muted);opacity:.45}
  #roomHint{margin-top:7px;font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);opacity:.65;line-height:1.5}
  #inviteRow{margin-top:14px;font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted)}
  #inviteRow b{color:var(--cream);font-weight:400}
  /* the presence tag: a unit status line, in the character cards' voice */
  .roomTag{margin-top:9px;padding:8px 11px;border-radius:10px;font-family:'Space Mono',monospace;
    font-size:10px;line-height:1.55;color:var(--muted);background:rgba(245,236,221,.05);
    border:1px solid rgba(245,236,221,.08);transition:opacity .3s ease}
  .roomTag:empty{display:none}
  .roomTag .u{display:block;font-size:8px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
  .roomTag b{color:var(--cream);font-weight:400}
  .roomTag.here{border-color:rgba(99,240,168,.28)}
  .roomTag.here .u{color:var(--net-together);opacity:.95}
  .roomTag.full{border-color:rgba(244,163,91,.35)}

  #continueBtn{margin-top:20px;width:100%;border:0;border-radius:14px;padding:15px;cursor:pointer;
    font-family:'Fredoka',system-ui,sans-serif;font-size:16px;font-weight:500;
    background:linear-gradient(180deg,var(--warm),#d98c47);color:#2a1710;
    box-shadow:0 8px 22px rgba(217,140,71,.28), inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .2s ease}
  #continueBtn:active{transform:scale(.97)}

  #breathe{text-align:center;margin-top:16px;font-family:'Space Mono',monospace;
    font-size:8.5px;letter-spacing:.08em;color:rgba(245,236,221,.35)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <div id="brand"><div class="n">Closer</div><div class="s">who's playing?</div></div>
  <div id="card">
    <span class="lbl">Your name</span>
    <input id="nameInput" type="text" maxlength="20" placeholder="your name" autocomplete="off">

    <div id="inviteRow" hidden>joining room <b id="inviteRoom"></b><div class="roomTag" id="inviteTag"></div></div>
    <details id="roomBox" hidden>
      <summary>joining someone? enter their room name</summary>
      <input id="roomInput" type="text" maxlength="32" placeholder="e.g. amber-tide-42" autocomplete="off" autocapitalize="none" spellcheck="false">
      <div class="roomTag" id="roomTag"></div>
      <div id="roomHint">Leave it empty to start your own room. You can share it from the cove's settings once you're in.</div>
    </details>

    <div id="connRow">
      <div class="podDot wait" id="connDot"></div>
      <span id="connText">waking the shore…</span>
    </div>

    <button id="continueBtn">Continue</button>
    <div id="breathe">Closer · أقرب</div>
  </div>
</div>

<script>
/* ---- name: remembered, one tap for a returning player ---- */
const nameInput = document.getElementById('nameInput');
const saved = localStorage.getItem('closer.name');
if (saved) { nameInput.value = saved; }
else { setTimeout(() => nameInput.focus(), 500); }   // first-timer: keyboard's ready

requestAnimationFrame(() => document.getElementById('card').classList.add('show'));

/* ---- room + server: read silently, never shown, always forwarded.
   Same "socket, not furniture" rule as everywhere else in the shell. ---- */
const qs = new URLSearchParams(location.search);
/* A link with ?room= is an invite: that room, no questions, nothing to fill
   in but a name. A bare visit starts its own room with a readable name, the
   kind you can say down a phone, unless the player opens the collapsed box
   and types the one they were told. Same normalisation as cove.html and the
   server, so "Amber Tide" and "amber-tide" are one room. */
const SERVER = qs.get('server') || 'wss://closer-server-c3f0.onrender.com';
function normRoom(r) {
  return String(r || '').toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 32);
}
const ROOM_A = ['amber','coral','drift','ember','golden','hushed','lantern','low','misty','moon','pearl','quiet','rose','salt','shell','silver','slow','soft','starlit','still','sun','tidal','warm','wild'];
const ROOM_B = ['bay','cove','dune','ember','fern','harbor','isle','kelp','lagoon','palm','reef','shore','sky','spark','stone','tide','wave','wind'];
function newRoomName() {
  const r = crypto.getRandomValues(new Uint32Array(3));
  return ROOM_A[r[0] % ROOM_A.length] + '-' + ROOM_B[r[1] % ROOM_B.length] + '-' + (10 + r[2] % 90);
}
const INVITED_ROOM = normRoom(qs.get('room'));
const OWN_ROOM = newRoomName();
const roomInput = document.getElementById('roomInput');
if (INVITED_ROOM) {
  document.getElementById('inviteRoom').textContent = INVITED_ROOM;
  document.getElementById('inviteRow').hidden = false;
} else {
  document.getElementById('roomBox').hidden = false;
}
function chosenRoom() { return INVITED_ROOM || normRoom(roomInput.value) || OWN_ROOM; }

/* ---- presence tag: asks the relay who is already in the room, and says it
   in the unit-card voice (UNIT 04 / status: waiting). Purely a nicety: if
   the relay is asleep or old, the tag stays empty and nothing else changes. */
const UNITS = {
  pip:    { unit: 'UNIT 04 · P!P',     line: (n) => `<b>${n}</b> is hovering on the shore, self-levelling. status: waiting for you` },
  mlkshk: { unit: 'UNIT 07 · M∞BI',    line: (n) => `<b>${n}</b> is already here, roumd and chonkie. status: waiting for you` },
};
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function lookRoom(room, tagEl) {
  if (!room) { tagEl.textContent = ''; tagEl.className = 'roomTag'; return; }
  let info;
  try {
    const r = await fetch(SERVER.replace(/^ws/, 'http') + '/room?r=' + encodeURIComponent(room), { cache: 'no-store' });
    info = await r.json();
  } catch { return; }
  if (!info || info.room !== normRoom(room === INVITED_ROOM ? room : chosenRoom())) return;   // a stale answer to an older keystroke
  if (info.full) {
    tagEl.className = 'roomTag full';
    tagEl.innerHTML = '<span class="u">cove · occupied</span>this cove already has its two. try another room name';
  } else if (info.n > 0) {
    const w = info.who[0], u = UNITS[w.char] || { unit: 'KOMPANION', line: (n) => `<b>${n}</b> is on the shore. status: waiting for you` };
    tagEl.className = 'roomTag here';
    tagEl.innerHTML = `<span class="u">${u.unit} · signal found</span>${u.line(esc(w.name))}`;
  } else {
    tagEl.className = 'roomTag';
    tagEl.innerHTML = '<span class="u">cove · quiet</span>nobody here yet. you’ll be first on the sand';
  }
}
if (INVITED_ROOM) {
  const t = document.getElementById('inviteTag');
  lookRoom(INVITED_ROOM, t);
  setInterval(() => lookRoom(INVITED_ROOM, t), 6000);   // they might arrive while you're typing your name
} else {
  const t = document.getElementById('roomTag');
  let deb = 0;
  roomInput.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(() => lookRoom(normRoom(roomInput.value), t), 350); });
}

/* ---- cold-start ping — the EXACT mechanism from index-7.html's
   warmServer(), not a reinvention. Never blocks continue; it's honesty,
   not a gate. ---- */
async function warmServer(url) {
  const httpUrl = url.replace(/^ws/, 'http');
  const ctrl = new AbortController();
  const bail = setTimeout(() => ctrl.abort(), 45000);
  try { await fetch(httpUrl, { signal: ctrl.signal, mode: 'no-cors' }); }
  catch { /* opaque response or timeout — we tried; the cove's own connect is the real fallback */ }
  clearTimeout(bail);
}
const dot = document.getElementById('connDot'), txt = document.getElementById('connText');
warmServer(SERVER).finally(() => {
  dot.classList.remove('wait'); dot.classList.add('solo');
  txt.textContent = 'the shore is awake';
});

/* ---- continue: never trap the player. Forwards room + server onward
   exactly as it received them — the doorway never becomes a dead end. ---- */
document.getElementById('continueBtn').addEventListener('click', () => {
  const name = (nameInput.value.trim() || 'Someone').slice(0, 20);
  localStorage.setItem('closer.name', name);
  const fwd = new URLSearchParams();
  fwd.set('room', chosenRoom());
  if (qs.get('server')) fwd.set('server', qs.get('server'));
  location.href = 'character-select.html?' + fwd.toString();
});
roomInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('continueBtn').click();
});
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('continueBtn').click();
});
</script>
