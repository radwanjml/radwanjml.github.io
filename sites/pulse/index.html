     Base brightness raised from 0.34/0.20 (bridge/intra-cluster) - like the
     nodes, edges were too dim at rest to read as a network. `breathe`
     applies here too so the whole graph swells together, not just nodes. */
  for(let i=0;i<edges.length;i++){
    const A=nodes[edges[i][0]], B=nodes[edges[i][1]];
    const bridge=A.cluster!==B.cluster;
    const near = selId>=0 ? ((A.id===selId||B.id===selId)?1:0) : 0;
    // idle bases lifted (0.30/0.44 -> 0.52/0.72) and given a dedicated pale
    // idle tint (mixEdgeColor, not mixColor) - the previous dark node-hue
    // edges at these opacities were near-invisible over a lit backdrop,
    // which was the direct cause of "the network doesn't read as a network".
    const eBreathe=breatheAt((clusterPhase[A.cluster]+clusterPhase[B.cluster])*0.5,0.90,1.0);
    const bA=((bridge?0.72:0.52)+A.act*0.85+near*0.6)*eBreathe;
    const bB=((bridge?0.72:0.52)+B.act*0.85+near*0.6)*eBreathe;
    mixEdgeColor(A,edgeTmp,0); const cAr=edgeTmp[0],cAg=edgeTmp[1],cAb=edgeTmp[2];
    mixEdgeColor(B,edgeTmp,0); const cBr=edgeTmp[0],cBg=edgeTmp[1],cBb=edgeTmp[2];

    // depth fade, matching the node rack-focus above so edges recede with
    // the same focal plane instead of forming a flat cage regardless of
    // what's in focus. Softened from 0.55 - edges vanishing too eagerly
    // out of focus was part of why the network read as sparse.
    const midDist=(camPos.distanceTo(A.pos)+camPos.distanceTo(B.pos))*0.5;
    const eBlur=Math.min(1,Math.abs(midDist-focusD)/depth);
    const fadeMul=1-eBlur*0.28;

    // bezier control point: cached bow direction (from buildGraph, stable)
    // re-anchored to the edge's LIVE midpoint every frame, so the curve
    // tracks bobbing/dragged nodes without recomputing its shape. Bow
    // amount itself was pulled way down (see buildGraph) after the previous
    // pass's curves read as "bent" rather than "designed".
    edgeCtrl.copy(A.pos).add(B.pos).multiplyScalar(0.5).add(edgeBow[i]);

    let pulsePos=-10, pulseAmp=0;
    // Arrival behaviour: `raw` used to be CLAMPED to 1, which parked the
    // travelling band motionless on top of the destination node for the whole
    // fade window and then cut it dead - reading as "the light stops on the
    // node, sits there, then vanishes" rather than as energy arriving. It now
    // keeps going past the end of the curve during PULSE_TAIL while its
    // amplitude falls off quadratically, so the band slides the rest of the
    // way into the node and is gone by the time it would have popped. The
    // node's own activation is already scheduled to land at exactly t1 (same
    // `travel` value drives both, see fire()), so the hand-off from "light on
    // the wire" to "node lit" happens on one frame with no gap or overlap.
    if(edgePulseT1[i]>edgePulseT0[i] && now<edgePulseT1[i]+PULSE_TAIL){
      const dur=Math.max(1,edgePulseT1[i]-edgePulseT0[i]);
      const raw=Math.max(0,(now-edgePulseT0[i])/dur);
      let along, amp=edgePulseAmp[i];
      if(raw<=1){
        along=raw;
      }else{
        const ft=Math.min(1,(now-edgePulseT1[i])/PULSE_TAIL);
        along = 1 + ft*0.5;        // continues past the node, not parked on it
        amp  *= (1-ft)*(1-ft);     // and is fully out before it would cut
      }
      pulsePos = edgePulseDir[i]>0 ? along : 1-along;
      pulseAmp = amp;
    }

    for(let s=0;s<SEG;s++){
      const t0=s/SEG, t1=(s+1)/SEG;
      bezierInto(A.pos,edgeCtrl,B.pos,t0,edgeP0);
      bezierInto(A.pos,edgeCtrl,B.pos,t1,edgeP1);
      const vi=(i*SEG+s)*2;
      ePos.set([edgeP0.x,edgeP0.y,edgeP0.z, edgeP1.x,edgeP1.y,edgeP1.z],vi*3);
      const b0=bA+(bB-bA)*t0, b1=bA+(bB-bA)*t1;
      eCol.set([
        (cAr+(cBr-cAr)*t0)*b0*fadeMul,(cAg+(cBg-cAg)*t0)*b0*fadeMul,(cAb+(cBb-cAb)*t0)*b0*fadeMul,
        (cAr+(cBr-cAr)*t1)*b1*fadeMul,(cAg+(cBg-cAg)*t1)*b1*fadeMul,(cAb+(cBb-cAb)*t1)*b1*fadeMul
      ],vi*3);
      ePulse[vi]=pulsePos; ePulse[vi+1]=pulsePos;
      ePulseAmp[vi]=pulseAmp; ePulseAmp[vi+1]=pulseAmp;
    }
  }
  edgeGeo.attributes.position.needsUpdate=true;
  edgeGeo.attributes.aColor.needsUpdate=true;
  edgeGeo.attributes.aPulse.needsUpdate=true;
  edgeGeo.attributes.aPulseAmp.needsUpdate=true;
  // frustumCulled=false on edgeMesh (set at creation) makes computeBoundingSphere
  // unnecessary here - it would otherwise run against the MAX-capacity buffer's
  // stale tail after a regen shrinks the edge count.
  edgeGeo.setDrawRange(0,Math.floor(edges.length*SEG*2*Math.min(1,Math.max(0,(en-.28)/.72))));
  edgeMat.uniforms.uOpacity.value=1.0*e;

  composer.render();
}
requestAnimationFrame(frame);

/* ================= RESIZE / CONTROLS ================= */
let rt;
addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  // re-read devicePixelRatio: dragging the window to a display with a
  // different DPR changes it, and without this the renderer keeps rendering
  // at the ratio captured at load while uPix below reports the new one.
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  const bw=MOBILE?innerWidth*0.55:innerWidth, bh=MOBILE?innerHeight*0.55:innerHeight;
  bloomPass.resolution.set(bw,bh);
  nodeMat.uniforms.uH.value=innerHeight;
  nodeMat.uniforms.uPix.value=renderer.getPixelRatio();   // was never updated here - node sprites kept a stale DPR after moving to a different-DPR display
  twinkleMat.uniforms.uH.value=innerHeight;
  twinkleMat.uniforms.uPix.value=renderer.getPixelRatio();
  gradePass.uniforms.uAspect.value=innerWidth/innerHeight;
},120);});
// Rebuilds in place rather than reloading via location.search - this file is
// frequently opened as a local file:// path or previewed by tools that inline
// it as a data: URL (confirmed live: location.protocol was literally "data:"
// with an empty location.search in that viewer), where a query-string reload
// is a silent no-op. regenerate()+the dissolve above work identically on
// data:/file:/http:.
document.getElementById("regen").addEventListener("click",()=>{
  if(phase==="dissolving") return;
  select(-1);
  for(let i=0;i<N;i++) dissolveAlpha0[i]=nAlpha[i];
  phase="dissolving"; dissolveStart=performance.now();
});
})();
</script>
</body>
</html>
