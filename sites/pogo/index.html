*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--t-m)/1.45 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

#app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:56px 1fr;height:100dvh}
#top{grid-column:1/-1;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);border-bottom:1px solid var(--line);background:var(--surface)}
.logo{font:600 var(--t-l)/1 var(--f-disp);letter-spacing:.3em;margin-right:var(--s2)}
.sp{flex:1}
.ibtn{min-width:var(--hit);height:36px;padding:0 var(--s3);border:1px solid var(--line);background:var(--surface);border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2)}
.ibtn:hover{border-color:var(--line-strong)}.ibtn:disabled{opacity:.35;cursor:default}
.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
#status{display:inline-flex;align-items:center;gap:var(--s2);height:32px;padding:0 var(--s3);border:1px solid var(--line);border-radius:999px;background:var(--surface)}

#stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 35%,var(--stage-hi),var(--stage-lo));touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

#overlay>*{pointer-events:auto;position:absolute;left:0;top:0}
/* handles */

.h svg{width:34px;height:34px;overflow:visible;filter:drop-shadow(0 1px 2px rgb(0 0 0/.35))}
.h .bg{fill:rgb(255 255 255/.88);stroke:var(--ink);stroke-width:1.2}.h .a{fill:none;stroke:var(--signal);stroke-width:2.5}.h .b{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}.h.near .a{stroke:var(--warn)}
.h.drag svg{transform:scale(1.18)}
.h .lbl{position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 var(--t-xs) var(--f-mono);background:var(--ink);color:var(--surface);padding:2px var(--s2);border-radius:var(--r);opacity:0;transition:opacity var(--dur-fast)}
.h.drag .lbl,.h:hover .lbl{opacity:1}
.plus{width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:1.5px solid var(--signal);background:var(--surface);color:var(--signal);font:600 22px/1 var(--f-body);display:grid;place-items:center;box-shadow:0 1px 4px rgb(0 0 0/.2)}
.plus.on{background:var(--signal);color:var(--signal-ink)}
.hold{width:56px;height:56px;margin:-28px 0 0 -28px;pointer-events:none!important}
.hold circle{fill:none;stroke:var(--signal);stroke-width:3;stroke-dasharray:157;stroke-dashoffset:157;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 400ms linear}
.hold.go circle{stroke-dashoffset:0}
#selbar{position:absolute;left:50%;bottom:var(--s4);transform:translateX(-50%);display:flex;gap:var(--s2);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s2) var(--s2) var(--s3);box-shadow:0 4px 18px rgb(0 0 0/.12);max-width:calc(100% - 24px)}

/* panel */
#dock{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.step{position:relative;isolation:isolate;height:56px;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:var(--s2);color:var(--ink-2);font-weight:400;transition:color var(--dur) var(--ease)}
.step::before{content:"";position:absolute;inset:8px 10px;border-radius:999px;background:transparent;z-index:-1;transition:background var(--dur) var(--ease)}
.step::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:transparent}
.step span{font:500 var(--t-xs) var(--f-mono);color:var(--ink-2)}
.step[aria-selected="true"]{color:var(--ink);font-weight:600}.step[aria-selected="true"]::before{background:color-mix(in oklch,var(--signal) 16%,transparent)}.step[aria-selected="true"] span{color:var(--signal)}.step[aria-selected="true"]::after{background:var(--signal)}
.step:not([aria-selected="true"]):hover{color:var(--ink)}
.panel{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--s4) var(--s4) var(--s5);overscroll-behavior:contain}
.panel h3{margin:var(--s5) 0 var(--s3);font:500 var(--t-xs)/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.panel h3:first-child{margin-top:var(--s2)}
.lead{margin:0 0 var(--s3);color:var(--ink-2)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.card{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:var(--s3);text-align:left;display:flex;flex-direction:column;gap:var(--s1);min-height:var(--hit)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--bg);border-radius:2px}
.card b{font-weight:600;font-size:var(--t-m)}.card small{font-size:var(--t-s);line-height:1.35;color:var(--ink-2)}
.card.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.card:hover{border-color:var(--line-strong)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s2) var(--s2) var(--s3)}
.stepper .ctl{display:flex;align-items:center;gap:var(--s2)}.stepper output{font:600 var(--t-l) var(--f-disp);min-width:2ch;text-align:center}
.rows{display:flex;flex-direction:column;gap:var(--s2)}
.slot{display:flex;align-items:center;gap:var(--s3);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);min-height:52px;background:var(--surface);text-align:left;width:100%}
.slot .n{font:500 var(--t-xs) var(--f-mono);color:var(--ink-2);width:3ch}.slot b{flex:1;font-weight:500}.slot small{font-size:var(--t-s);line-height:1.35;color:var(--ink-2)}
.slot.empty b{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chipb{height:40px;padding:0 var(--s4);border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chipb.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;min-height:var(--hit);border-top:1px solid var(--line);margin-top:var(--s4);padding-top:var(--s2)}
.sw{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background var(--dur)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform var(--dur) var(--ease)}
.sw:checked{background:var(--signal)}.sw:checked::after{transform:translateX(18px)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.theme{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:var(--s2);display:flex;flex-direction:column;gap:var(--s2);align-items:flex-start;min-height:72px}
.theme .dots{display:flex}.theme .dots i{width:22px;height:22px;border-radius:50%;border:1px solid rgb(0 0 0/.12);margin-right:-6px}
.theme em{font-style:normal;font-size:var(--t-xs);color:var(--ink-2);text-align:left}
.theme.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
details.fold{margin-top:var(--s4);border-top:1px solid var(--line)}
details.fold summary{min-height:var(--hit);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);cursor:pointer;font-weight:500;list-style:none}details.fold summary::-webkit-details-marker{display:none}details.fold summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:translateY(-2px) rotate(45deg);transition:transform var(--dur) var(--ease);flex:none;margin-right:var(--s1)}details.fold[open] summary::after{transform:translateY(2px) rotate(-135deg)}@media (prefers-reduced-motion:reduce){details.fold summary::after{transition:none}}
.crow{padding:var(--s2) 0;border-bottom:1px solid var(--line)}.crow b{font-weight:500}.crow small{font-size:var(--t-s);line-height:1.35;color:var(--ink-2);margin-left:var(--s2)}
.swatches{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.swb{width:32px;height:32px;padding:0;border-radius:50%;border:1px solid rgb(0 0 0/.15)}.swb.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);margin-top:var(--s2)}.seg button{border:0;background:none;padding:var(--s2) var(--s3);font-size:var(--t-xs)}.seg button.on{background:var(--ink);color:var(--surface)}

#boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);z-index:50;transition:opacity .4s}

 #app{grid-template-columns:1fr;grid-template-rows:52px minmax(0,1fr) auto}
