<script type="module">
import { initTopo } from './drafts/topo.js';
// Models v5 (Addendum 40): one 2D canvas. Each render is baked once into a glass tile (organic hexagon clip, image,
// dome highlight, lip, bevel, contour ring); a frame only stamps ~45 tiles at their sphere positions with drawImage.

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(hover: none), (pointer: coarse)').matches;
const root = document.documentElement;

const R = [
  ['perfume', 'JAMEEL perfume'], ['1966-headphones', '1966 Headphones'], ['wine', 'Wine pour'], ['snow-glode-paris', 'Snow globe, Paris'],
  ['potion', 'Potion'], ['topographic-map', 'Topographic map'], ['milk-carton', 'Milk carton'], ['candy-geometry-nodes', 'Candy, geometry nodes'],
  ['statue-bust', 'Statue bust'], ['skull-on-fire', 'Skull on fire'], ['rocket', 'Rocket'], ['cosmetics', 'Magnolia strawberry perfume'],
  ['zerene-cosmatics', 'Vitamin C serum'], ['smily-clip', 'Smiley clip'], ['jwellery', 'Silver ring'], ['statue-flake', 'Statue flake'],
  ['car-gls-600', 'Mercedes-Maybach GLS 600', 'Fan render · vehicle design © Mercedes-Benz · personal study, not affiliated'],
  ['baymax', 'Baymax', 'Fan art · Baymax © Disney · personal study, not affiliated'],
  ['doc-ock-robot-arms', 'Doc Ock robot arms', 'Fan art · Doctor Octopus © Marvel · personal study, not affiliated'],
  ['elmo', 'Elmo', 'Fan art · Elmo © Sesame Workshop · personal study, not affiliated'],
  ['huggy-wuggy', 'Huggy Wuggy', 'Fan art · Huggy Wuggy © Mob Entertainment · personal study, not affiliated'],
  ['car-show-room', 'Car showroom', 'Fan render · vehicle design © its manufacturer · personal study, not affiliated'],
  ['color-swatch-fans', 'Colour swatch fan'], ['color-swatch-fan-batom-outono', 'Swatch fan, Batom Outono'], ['cotton-candy-hand-moisturizer', 'Cotton candy hand cream'],
  ['asabco-motor-oil', 'Motor oil bottle'], ['geodesic-dome', 'Geodesic dome'], ['cappadocia', 'Cappadocia'], ['hot-air-baloon', 'Hot air balloon'],
  ['armored-warior-under-a-cherry-blossom', 'Warrior under a cherry blossom'], ['hotel-elevation-3d-model', 'Hotel elevation'], ['diwali-roof-top', 'Diwali rooftop'],
  ['road-car-drive', 'Night drive'], ['surfer', 'Surfer'],

document.getElementById('count').textContent = R.length;
if (coarse) document.getElementById('hint-verb').textContent = 'Swipe';

// ---- lattice on a torus (honeycomb), mapped onto a sphere ----
const small = innerWidth < 720;

// row step K: repeats far apart, fan art out of the inner rings (Addendum 38/39)
let K = 1, bestMin = -1; const cand = [];
for (let k = 1; k < R.length; k++) {
  let m = 1e9;
  for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++) {
    if ((P[a][0] + P[a][1] * k - P[b][0] - P[b][1] * k) % R.length) continue;
    m = Math.min(m, Math.hypot(wrapD(P[a][2] - P[b][2], TW), wrapD(P[a][3] - P[b][3], TH)));
  }
  cand.push({ k, m }); if (m > bestMin) { bestMin = m; K = k; }
}
{
  const ctr = P.reduce((b, p) => (Math.hypot(p[2] - TW / 2, p[3] - TH / 2) < Math.hypot(b[2] - TW / 2, b[3] - TH / 2) ? p : b));
  const fanNear = (k) => {
    const i0 = (ctr[0] + ctr[1] * k) % R.length; let n = 0;
    for (const p of P) {
      const d = Math.hypot(wrapD(p[2] - ctr[2], TW), wrapD(p[3] - ctr[3], TH)); if (d > DX * 2.2) continue;
      const i = (((p[0] + p[1] * k - i0) % R.length) + R.length) % R.length; if (R[i][2]) n += d < DX * 1.2 ? 3 : 1;
    }
    return n;
  };
  const ok = cand.filter((c) => c.m >= bestMin * 0.85).sort((a, b) => fanNear(a.k) - fanNear(b.k) || b.m - a.m);
  if (ok.length) K = ok[0].k;
}
const cells = P.map(([c, r, x, y]) => ({ i: (((c + r * K) % R.length) + R.length) % R.length, x, y }));
const first = cells.filter((it) => it.i === 0).sort((A, B) => Math.hypot(A.x - TW / 2, A.y - TH / 2) - Math.hypot(B.x - TW / 2, B.y - TH / 2))[0];
const off = { x: innerWidth / 2 - first.x, y: innerHeight / 2 - first.y };

// ---- organic hexagon shape per render (unit radius ~0.9, pointy top) ----
const TAU = Math.PI * 2, NPT = 64;
function shapePts(seedN, t) {
  let s = (seedN + 3) * 7919; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const terms = [2, 3, 4, 5].map((f) => ({ f, a: (0.012 + rnd() * 0.018) / (f * 0.5), p: rnd() * TAU, w: (0.1 + rnd() * 0.14) * (rnd() < 0.5 ? -1 : 1) }));

  for (let i = 0; i < NPT; i++) {
    const th = (i / NPT) * TAU; let rad = 0.9 * (1 + 0.055 * Math.cos(6 * th + Math.PI));
    for (const q of terms) rad += q.a * Math.sin(q.f * th + q.p + t * q.w);
    pts.push([Math.cos(th) * rad, Math.sin(th) * rad]);
  }

}
const pathFrom = (pts, scale, cx, cy) => { const p = new Path2D(); pts.forEach(([x, y], k) => (k ? p.lineTo : p.moveTo).call(p, cx + x * scale, cy + y * scale)); p.closePath(); return p; };

// ---- bake tiles ----
const DPR = Math.min(devicePixelRatio || 1, 1.5);   // was 2: tiles are re-stamped while dragging; 1.5x is sharp enough (Addendum 46)
const MOTIF = getComputedStyle(root).getPropertyValue('--motif').trim() || '#E8B04A';
const LIGHT = root.dataset.mode === 'light';
const TILE = Math.ceil(BASE * 2.6 * DPR);                 // tile canvas size (shape radius 0.9 -> BASE px, plus room for the ring/shadow)
const UNIT = (BASE * DPR) / 0.9;
const tiles = R.map(() => null), imgs = R.map(() => null);
function bake(i, t = 0) {
  const img = imgs[i]; if (!img) return;
  const cv = tiles[i]?.cv || document.createElement('canvas'); cv.width = cv.height = TILE;
  const g = cv.getContext('2d'); g.clearRect(0, 0, TILE, TILE);
  const c = TILE / 2, pts = shapePts(i, t), shape = pathFrom(pts, UNIT, c, c);

  g.save(); g.shadowColor = LIGHT ? 'rgba(110,60,30,.35)' : 'rgba(0,0,0,.55)'; g.shadowBlur = 14 * DPR; g.shadowOffsetY = 8 * DPR;
  g.fillStyle = LIGHT ? '#e9d8c6' : '#141020'; g.fill(shape); g.restore();
  // the render, cover-fitted into the shape
  g.save(); g.clip(shape);
  const box = 2.0 * UNIT, sc = Math.max(box / img.width, box / img.height), w = img.width * sc, h = img.height * sc;
  g.drawImage(img, c - w / 2, c - h / 2, w, h);

  let gr = g.createRadialGradient(c - 0.32 * UNIT, c - 0.5 * UNIT, 0, c - 0.32 * UNIT, c - 0.5 * UNIT, 1.15 * UNIT);
  gr.addColorStop(0, 'rgba(255,255,255,.42)'); gr.addColorStop(0.45, 'rgba(255,255,255,.07)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, TILE, TILE);
  gr = g.createRadialGradient(c, c + 1.0 * UNIT, 0, c, c + 1.0 * UNIT, 1.1 * UNIT);
  gr.addColorStop(0, 'rgba(255,255,255,.2)'); gr.addColorStop(0.45, 'rgba(255,255,255,.02)'); gr.addColorStop(1, 'rgba(0,0,0,.28)');
  g.fillStyle = gr; g.fillRect(0, 0, TILE, TILE);
  g.restore();
  // bevel line: bright top-left, catch bottom-right
  gr = g.createLinearGradient(c - UNIT, c - UNIT, c + UNIT, c + UNIT);
  gr.addColorStop(0, 'rgba(255,255,255,.8)'); gr.addColorStop(0.38, 'rgba(255,255,255,.1)'); gr.addColorStop(0.68, 'rgba(255,255,255,.03)'); gr.addColorStop(1, 'rgba(255,255,255,.4)');

  g.globalAlpha = 0.45; g.lineWidth = 1 * DPR; g.strokeStyle = MOTIF; g.stroke(pathFrom(shapePts(i, t - 1.2), UNIT * 1.12, c, c)); g.globalAlpha = 1;

// load thumbs; bake as they arrive (centre ones first)
const order = [...new Set(cells.slice().sort((a, b) => Math.hypot(a.x + off.x - innerWidth / 2, a.y + off.y - innerHeight / 2) - Math.hypot(b.x + off.x - innerWidth / 2, b.y + off.y - innerHeight / 2)).map((c) => c.i))];
order.forEach((i) => { const im = new Image(); im.decoding = 'async'; im.src = `assets/img/models/${R[i][0]}_t.webp`; im.onload = () => { imgs[i] = im; bake(i); dirty = true; kick(); }; });

// ---- canvas + drawing ----
const field = document.getElementById('field');
const cv = document.createElement('canvas'); field.appendChild(cv);
const ctx = cv.getContext('2d');
function resize() { cv.width = Math.round(innerWidth * DPR); cv.height = Math.round(innerHeight * DPR); cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; dirty = true; kick(); }
addEventListener('resize', resize);
const nameEl = document.getElementById('name');
let px = 0, py = 0, vx = 0, vy = 0, drag = null, moved = 0, dirty = true, raf = 0, focus = null, hover = null, lastT = 0, acc = 0, liveT = 0;
const drawn = [];   // screen positions for hit-testing
let pf = 0; const fetchBigLater = (i) => { clearTimeout(pf); pf = setTimeout(() => fetchBig(i), 400); };   // the centred render's big file, once the field settles
function draw() {
  const cx = innerWidth / 2, cy = innerHeight / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  drawn.length = 0;
  for (const it of cells) {
    const x = wrapD(it.x + off.x + px - cx, TW), y = wrapD(it.y + off.y + py - cy, TH);
    const u = x / RX, v = y / RY, a = Math.hypot(u, v) || 1e-6;
    if (a > 1.52) continue;
    const k = Math.sin(a) / a, sx = cx + u * RX * k, sy = cy + v * RY * k;
    const s = Math.pow(Math.max(Math.cos(a), 0), 0.8) * 0.97 + 0.05;
    drawn.push({ it, sx, sy, s, a });
  }
  drawn.sort((p, q) => p.s - q.s);   // small (rim) first, big (centre) on top
  let best = null;
  for (const d of drawn) {
    const t = tiles[d.it.i]; if (!t) continue;
    const size = (TILE / DPR) * d.s * (d.it === hover ? 1.05 : 1);
    ctx.globalAlpha = Math.min(1, Math.max(0, (1.52 - d.a) / 0.32));
    ctx.drawImage(t.cv, (d.sx - size / 2) * DPR, (d.sy - size / 2) * DPR, size * DPR, size * DPR);
    if (!best || d.a < best.a) best = d;
  }

  focus = best && best.a < 0.35 ? best : null;
  if (focus) {   // dashed outer ring + name on the centred render
    const t = tiles[focus.it.i];
    if (t) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.setLineDash([2, 5]); ctx.globalAlpha = 0.5; ctx.strokeStyle = MOTIF; ctx.lineWidth = 1;

    if (!drag) fetchBigLater(focus.it.i);

  } else nameEl.style.opacity = 0;
}
function frame(now) {
  raf = 0;
  const dt = Math.min((now - (lastT || now)) / 1000, 0.05); lastT = now;
  let moving = false;
  if (!drag && Math.abs(vx) + Math.abs(vy) > 0.05) { px += vx; py += vy; vx *= 0.93; vy *= 0.93; moving = true; dirty = true; }
  // desktop: the few big centre tiles re-bake their edge a little (liquid), ~12 fps; phones keep still edges
  if (!coarse && !reduced) {
    acc += dt;
    if (acc > 1 / 12) {
      liveT += acc * 0.45; acc = 0;
      for (const d of drawn) if (d.a < 0.6 && imgs[d.it.i]) bake(d.it.i, liveT + d.it.i);
      dirty = true;
    }
    moving = true;
  }
  if (dirty) { draw(); dirty = false; }
  if (moving || drag) raf = requestAnimationFrame(frame);
}
function kick() { if (!raf) { lastT = 0; raf = requestAnimationFrame(frame); } }
resize();

// ---- input ----
const hit = (x, y) => { for (let k = drawn.length - 1; k >= 0; k--) { const d = drawn[k]; if (Math.hypot(x - d.sx, y - d.sy) < BASE * d.s * 0.92) return d; } return null; };
field.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; moved = 0; vx = vy = 0; field.setPointerCapture(e.pointerId); field.classList.add('drag'); kick(); });
field.addEventListener('pointermove', (e) => {
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy); px += dx; py += dy; vx = dx; vy = dy; drag.x = e.clientX; drag.y = e.clientY; dirty = true; kick(); return; }
  if (!coarse) { const h = hit(e.clientX, e.clientY)?.it || null; if (h !== hover) { hover = h; field.style.cursor = h ? 'pointer' : 'grab'; dirty = true; kick(); } }
});
const end = (e) => {
  if (!drag) return; const tap = e.type === 'pointerup' && moved < 8; drag = null; field.classList.remove('drag');
  if (reduced) vx = vy = 0;
  if (tap) { const d = hit(e.clientX, e.clientY); if (d) open(d.it.i); }
  kick();
};
field.addEventListener('pointerup', end); field.addEventListener('pointercancel', end);
addEventListener('wheel', (e) => { if (lb.classList.contains('open')) return; px -= e.deltaX * 0.8; py -= e.deltaY * 0.8; dirty = true; kick(); }, { passive: true });
addEventListener('keydown', (e) => {
  if (lb.classList.contains('open')) return;
  const k = { ArrowLeft: [10, 0], ArrowRight: [-10, 0], ArrowUp: [0, 10], ArrowDown: [0, -10] }[e.key]; if (k) { vx = k[0]; vy = k[1]; kick(); }
  if (e.key === 'Enter' && focus) open(focus.it.i);
});

// ---- lightbox ----
const lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbT = lb.querySelector('figcaption b'), lbNote = lb.querySelector('figcaption span');
let cur = 0;
// the previous render used to stay up until the next large file arrived: now the cached thumbnail shows at once,
// the large file fades in when it has decoded, and the neighbours are prefetched so prev/next are instant
const big = new Map();
const fetchBig = (i) => { i = (i + R.length) % R.length; if (!big.has(i)) { const im = new Image(); im.decoding = 'async'; im.src = `assets/img/models/${R[i][0]}.webp`; big.set(i, im); } return big.get(i); };
const lbCount = document.getElementById('lb-count');
const show = (i) => {
  cur = (i + R.length) % R.length; const c = cur;
  lbT.textContent = R[c][1]; lbNote.textContent = R[c][2] || 'Modelled and rendered in Blender'; lbImg.alt = R[c][1];
  lbCount.textContent = `${c + 1} / ${R.length}`;
  const b = fetchBig(c);
  if (b.complete && b.naturalWidth) { lbImg.src = b.src; lbImg.classList.remove('soft'); }
  else {
    lbImg.src = imgs[c]?.src || `assets/img/models/${R[c][0]}_t.webp`; lbImg.classList.add('soft');
    b.decode().then(() => { if (cur === c) { lbImg.src = b.src; lbImg.classList.remove('soft'); } }).catch(() => {});
  }
  fetchBig(c + 1); fetchBig(c - 1);
};
// swipe between renders on touch screens
let sw = null;
lb.addEventListener('touchstart', (e) => { sw = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', (e) => { if (sw == null) return; const dx = e.changedTouches[0].clientX - sw; sw = null; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); }, { passive: true });
function open(i) { show(i); lb.classList.add('open'); lb.querySelector('.x').focus({ preventScroll: true }); }
const close = () => lb.classList.remove('open');
lb.querySelector('.x').addEventListener('click', close);
lb.querySelector('.prev').addEventListener('click', () => show(cur - 1));
lb.querySelector('.next').addEventListener('click', () => show(cur + 1));
lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
addEventListener('keydown', (e) => { if (!lb.classList.contains('open')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });

const mb = document.querySelector('.menu-btn'), menu = document.getElementById('menu');
mb.addEventListener('click', () => { const o = menu.hidden; mb.setAttribute('aria-expanded', String(o)); menu.hidden = !o; });
</script>
</body>
</html>
