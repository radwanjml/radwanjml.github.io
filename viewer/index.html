<style>
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); }
#vp { position: fixed; inset: 0; touch-action: none; cursor: grab; } #vp:active { cursor: grabbing; }
#vp canvas { display: block; width: 100%; height: 100%; outline: none; }
.vbar { position: fixed; left: 50%; translate: -50% 0; top: 84px; z-index: 5; display: flex; gap: 4px; padding: 6px; border-radius: 999px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); }
.vbar button, .shade button { font: 500 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); background: none; border: 0; border-radius: 999px; padding: 0 14px; min-height: 44px; cursor: pointer; }
.vbar button[aria-pressed="true"], .shade button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent, #111); }
.shade { position: fixed; right: var(--pad); bottom: 22px; z-index: 5; display: flex; gap: 4px; padding: 6px; border-radius: 999px; }
.stats { position: fixed; left: var(--pad); bottom: 22px; z-index: 5; padding: 14px 18px; border-radius: 18px; font: 400 12px/1.7 var(--mono); color: var(--text-2); min-width: 210px; }
.stats h1 { display: block; font: 400 24px/1.1 var(--serif); color: var(--text); margin: 0 0 6px; }
.stats small { display: block; color: var(--text-3); margin-top: 6px; font-size: 12px; }
.keys { position: fixed; right: var(--pad); bottom: 88px; z-index: 5; font: 400 12px/1.7 var(--mono); color: var(--text-3); text-align: right; margin: 0; }
.load { position: fixed; inset: 0; display: grid; place-items: center; font: 500 12px/1 var(--mono); letter-spacing: .1em; color: var(--text-3); pointer-events: none; transition: opacity .4s; }
.load.gone { opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
@media (max-width: 720px) { .vbar { top: 76px; } .vbar { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; width: max-content; } .vbar button { padding: 0 11px; flex: none; } .stats { left: 16px; right: 16px; bottom: 84px; min-width: 0; padding: 10px 14px; } .stats h1 { font-size: 19px; } .shade { left: 50%; right: auto; translate: -50% 0; bottom: 18px; } .keys { display: none; } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Addendum 48: a Blender-style viewport for the exported GLBs. Renders only when something changes.
const MODELS = {
  herrand: { name: 'Herrand delivery robot', short: 'Herrand', note: 'Concept robot · cast frame grown by an optimiser · Blender', url: 'assets/models/herrand.glb' },
  headphones: { name: '1966 Headphones', short: 'Headphones', note: 'Hard-surface · modelled in Blender', url: 'assets/models/headphones.glb' },
  perfume: { name: 'JAMEEL perfume', short: 'Perfume', note: 'Glass, liquid, gold foil · Blender', url: 'assets/models/perfume.glb' },
  wine: { name: 'Wine pour', short: 'Wine', note: 'Glass and bottle · Blender (the poured wine is a simulation, not included)', url: 'assets/models/wine.glb' },
  milk: { name: 'Milk carton', short: 'Milk', note: 'Character prop · Blender', url: 'assets/models/milk.glb' },
  rocket: { name: 'Rocket', short: 'Rocket', note: 'Toy rocket · Blender', url: 'assets/models/rocket.glb' },
  pip: { name: 'Pip', short: 'Pip', note: 'A Closer character · Blender', url: 'assets/models/pip.glb' },
  moobi: { name: 'Moobi', short: 'Moobi', note: 'A Closer character · Blender', url: 'assets/models/moobi.glb' },
  eli3: { name: 'Eli3', short: 'Eli3', note: 'A Closer character · Blender', url: 'assets/models/eli3.glb' },
};
const vp = document.getElementById('vp');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.debug.checkShaderErrors = false;   // Addendum 54: the per-shader status query made the page wait on the GPU (1 s first frame, cold cache)
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.AgXToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
vp.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer); const env = pm.fromScene(new RoomEnvironment(), 0.04).texture; pm.dispose();
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.09;
const grid = new THREE.GridHelper(20, 40); grid.material.transparent = true; grid.material.opacity = .22; scene.add(grid);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 5, 4); scene.add(key, new THREE.HemisphereLight(0xffffff, 0x333333, .6));

let current = null, shade = 'rendered', dirty = true;
const css = (v) => getComputedStyle(document.body).getPropertyValue(v).trim();
function theme() { scene.background = new THREE.Color(css('--bg') || '#1a1625'); grid.material.color.set(css('--text-3') || '#888888'); dirty = true; }

const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: .55 });
const solidMat = new THREE.MeshMatcapMaterial({ color: 0xd8d4cc });   // like Blender's grey Solid shading
{ const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const gr = g.createRadialGradient(48, 40, 6, 64, 64, 70); gr.addColorStop(0, '#fff'); gr.addColorStop(.5, '#9a9a9a'); gr.addColorStop(1, '#2a2a2a'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); solidMat.matcap = new THREE.CanvasTexture(c); solidMat.matcap.colorSpace = THREE.SRGBColorSpace; }

globalThis.__meshoptWorkers ||= (MeshoptDecoder.useWorkers?.(2), true);   // Addendum 54: decode GLB geometry off the main thread (load-time microtask bursts in Red's trace)
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const cache = {};
// Eli3's doodles and face are applied in code on the site (chars.js), not stored in her GLB: same here
const texL = new THREE.TextureLoader();
const tex = (u) => { const t = texL.load(u, () => { dirty = true; }); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; return t; };
function dressEli3(root) {
  const doodle = tex('assets/tex/eli3_doodles.webp'), face = tex('assets/tex/eli3_face.webp');
  root.traverse((o) => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { if (m.name === 'Base') { m.map = doodle; m.color.set(0xffffff); m.metalness = 0; m.roughness = 0.55; m.needsUpdate = true; } });
    if (o.name === 'Screen') o.material = new THREE.MeshStandardMaterial({ color: 0x05070c, roughness: 0.12, map: face, emissive: 0xcfe8ff, emissiveMap: face, emissiveIntensity: 2.2 });
  });
}
function count(root) { let v = 0, t = 0; root.traverse((o) => { if (o.isMesh) { const g = o.geometry; v += g.attributes.position.count; t += (g.index ? g.index.count : g.attributes.position.count) / 3; } }); return { v, t: Math.round(t) }; }
function applyShade() {
  if (!current) return;
  scene.environment = shade === 'rendered' ? env : null;
  current.traverse((o) => { if (o.isMesh) { o.userData.orig ??= o.material; o.material = shade === 'rendered' ? o.userData.orig : shade === 'wire' ? wireMat : solidMat; } });
  document.querySelectorAll('[data-shade]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.shade === shade)));
  dirty = true;
}
function frame(dir) {
  const box = new THREE.Box3().setFromObject(current), c = box.getCenter(new THREE.Vector3());
  const r = box.getSize(new THREE.Vector3()).length() / 2;
  const d = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.aspect < 1 ? 1.5 : 1.05);
  const v = dir || camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(c); camera.position.copy(c).addScaledVector(v, d);
  camera.near = r / 100; camera.far = r * 100; camera.updateProjectionMatrix();
  controls.minDistance = r * .3; controls.maxDistance = r * 8; dirty = true;
}
async function show(id) {
  const M = MODELS[id]; if (!M) return;
  const load = document.getElementById('load'); load.classList.remove('gone');
  document.querySelectorAll('#pick button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.m === id)));
  if (!cache[id]) {
    const root = (await loader.loadAsync(M.url)).scene;
    if (id === 'eli3') dressEli3(root);
    const box = new THREE.Box3().setFromObject(root);
    root.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2);
    const wrap = new THREE.Group(); wrap.add(root); cache[id] = { obj: wrap, n: count(root) };
  }
  if (current) scene.remove(current);
  current = cache[id].obj; scene.add(current);
  const s = new THREE.Box3().setFromObject(current).getSize(new THREE.Vector3()); grid.scale.setScalar(Math.max(s.x, s.y, s.z) / 4);
  applyShade(); frame(new THREE.Vector3(1, .55, 1.4).normalize());
  await renderer.compileAsync(scene, camera);
  const { v, t } = cache[id].n;
  document.getElementById('s-name').textContent = M.name;
  document.getElementById('s-line').textContent = `${v.toLocaleString('en')} verts · ${t.toLocaleString('en')} tris`;
  document.getElementById('s-note').textContent = M.note;
  history.replaceState(null, '', `viewer/?m=${id}`);
  load.classList.add('gone'); dirty = true;
}

const pick = document.getElementById('pick');
pick.innerHTML = Object.entries(MODELS).map(([k, m]) => `<button type="button" data-m="${k}" aria-pressed="false">${m.short}</button>`).join('');
pick.addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (b) show(b.dataset.m); });
document.querySelector('.shade').addEventListener('click', (e) => { const b = e.target.closest('[data-shade]'); if (b) { shade = b.dataset.shade; applyShade(); } });
addEventListener('keydown', (e) => {
  if (!current) return;
  const V = { Digit1: [0, 0, 1], Numpad1: [0, 0, 1], Digit3: [1, 0, 0], Numpad3: [1, 0, 0], Digit7: [0, 1, 1e-4], Numpad7: [0, 1, 1e-4] }[e.code];
  if (V) frame(new THREE.Vector3(...V).normalize()); else if (e.code === 'KeyF') frame();
});

function size() { const w = vp.clientWidth, h = vp.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true; }
new ResizeObserver(size).observe(vp); size(); theme();
controls.addEventListener('change', () => { dirty = true; });
renderer.setAnimationLoop(() => { const moved = controls.update(); if (!dirty && !moved) return; dirty = false; renderer.render(scene, camera); });

const q = new URLSearchParams(location.search).get('m');
show(MODELS[q] ? q : 'headphones').catch(() => { document.getElementById('load').textContent = 'THIS MODEL NEEDS WEBGL'; });

const mb = document.querySelector('.menu-btn'), menu = document.getElementById('menu');
mb?.addEventListener('click', () => { const o = mb.getAttribute('aria-expanded') !== 'true'; mb.setAttribute('aria-expanded', String(o)); menu.hidden = !o; });
</script>
